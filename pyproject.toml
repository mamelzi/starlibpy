[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starlibpy"
version = "0.3.0b1"
description = "Statistical Tools for Academic Research Library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Dr. M.A. Melzi, MD"}
]
keywords = [
  "statistics", "academic research", "biomedical research", "clinical research",
  "epidemiology", "survival analysis", "diagnostic accuracy", "publication reporting"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "patsy>=0.5.6",
]

[project.optional-dependencies]
data = [
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "pyarrow>=14",
]
plotting = [
  "matplotlib>=3.8",
]
diagnostic = [
  "scikit-learn>=1.3",
]
reporting = [
  "matplotlib>=3.8",
  "Jinja2>=3.1",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "Pillow>=10",
  "webcolors>=24",
]
survival = [
  "lifelines>=0.29",
]
posthoc = [
  "scikit-posthocs>=0.9",
]
full = [
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "Jinja2>=3.1",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "Pillow>=10",
  "webcolors>=24",
  "PyYAML>=6.0",
  "pyarrow>=14",
  "lifelines>=0.29",
  "scikit-posthocs>=0.9",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
starlibpy = ["py.typed", "**/py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore:.*distutils Version classes are deprecated.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["starlibpy"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
